name: fielddesk-spiffe-wif

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./spire/server.conf:/etc/spire/server.conf:ro
      - spire-server-data:/var/lib/spire/server
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.4
    networks: [lab]

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.5@sha256:3652c732b0f0d36f4dd78394230a1b1cd0ddcc29548a46c67a996b1a78c14481
    command: ["-config", "/etc/spire/agent.conf", "-joinToken=${SPIRE_JOIN_TOKEN:-}"]
    depends_on: [spire-server]
    pid: host
    volumes:
      - ./spire/agent.conf:/etc/spire/agent.conf:ro
      - ./state/server-bundle.pem:/run/lab/server-bundle.pem:ro
      - spire-agent-data:/var/lib/spire/agent
      - spire-socket:/run/spire
      # Only this trusted attestor may query the Docker API. A read-only mount
      # does not make Docker API access read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.4
    networks: [lab]

  oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.15.5@sha256:8889641f0eaec84bb42ea1445dff71c0a6a2cfd2a3cfbbee63d17578aaaec7fc
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    command: ["-config", "/etc/spire/oidc.conf"]
    depends_on: [spire-agent]
    labels:
      fielddesk.workload: oidc
    volumes:
      - ./spire/oidc.conf:/etc/spire/oidc.conf:ro
      - ./state/tls/oidc.crt:/run/lab/tls/oidc.crt:ro
      - ./state/tls/oidc.key:/run/lab/tls/oidc.key:ro
      - spire-socket:/run/spire:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.2
    networks:
      lab:
        aliases: [oidc.local]

  opa:
    image: openpolicyagent/opa:1.22.0@sha256:895872de1e8dc5b82e04f9410d2d1ada2f72d28fdcdba0e8789d91cfc27ec0d0
    user: "10001:10001"
    command: ["run", "--server", "--authorization=basic", "--addr=0.0.0.0:8181", "--log-level=error", "--log-level-request=error", "/policy/authz.rego", "/policy/api_authz.rego"]
    volumes:
      - ./policy/authz.rego:/policy/authz.rego:ro
      - ./policy/api_authz.rego:/policy/api_authz.rego:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.15
    networks: [policy]

  mock-api:
    build:
      context: ../..
      dockerfile: FIELD/spiffe-wif-lab/mock_api.Dockerfile
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      LAB_MODE: ${LAB_MODE:-protected}
      LAB_TASK_KIND: ${LAB_TASK_KIND:-read}
      LAB_TASK_ID: ${LAB_TASK_ID:-task-alpha}
      LAB_STATE_DIR: /lab/state
      OPA_URL: http://opa:8181
      SPIRE_ISSUER: https://oidc.local:8443
      SPIRE_JWKS_URL: https://oidc.local:8443/keys
      SPIFFE_AGENT_ID: spiffe://fielddesk.test/agent
      TLS_CA_FILE: /run/lab/tls/ca.crt
    depends_on: [oidc, opa]
    volumes:
      - ./state/tls/ca.crt:/run/lab/tls/ca.crt:ro
      - ./state/data:/lab/state
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.35
    networks: [lab, policy]

  agent:
    profiles: [exercise]
    image: fielddesk-spiffe-agent:local
    build:
      context: ./client
      target: agent
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent.sock
      WIF_URL: http://mock-api:8080
    depends_on: [spire-agent, mock-api]
    labels:
      fielddesk.workload: agent
    volumes:
      - spire-socket:/run/spire:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    networks: [lab]

  rogue:
    profiles: [exercise]
    image: fielddesk-spiffe-rogue:local
    build:
      context: ./client
      target: rogue
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent.sock
      WIF_URL: http://mock-api:8080
    depends_on: [spire-agent, mock-api]
    # Deliberate label collision to show why a label-only SPIRE entry is weak.
    labels:
      fielddesk.workload: agent
    volumes:
      - spire-socket:/run/spire:ro
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    networks: [lab]

networks:
  lab:
    internal: true
  policy:
    internal: true

volumes:
  spire-server-data: {}
  spire-agent-data: {}
  spire-socket: {}
