log_level = "info"
domains = ["oidc.local"]
jwt_issuer = "https://oidc.local:8443"
jwks_uri = "https://oidc.local:8443/keys"
set_key_use = true

serving_cert_file {
    cert_file_path = "/run/lab/tls/oidc.crt"
    key_file_path = "/run/lab/tls/oidc.key"
    addr = ":8443"
}

workload_api {
    socket_path = "/run/spire/agent.sock"
    trust_domain = "fielddesk.test"
}
