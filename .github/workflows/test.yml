name: Laboratory checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test,browser,chat]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q --tb=short
      - run: docker build -f docker/worker.Dockerfile -t red-blue-field-worker:0.4.0 .
      - run: RBF_TEST_DOCKER=1 pytest -q tests/test_docker.py --tb=short
      - run: RBF_TEST_BROWSER=1 pytest -q tests/test_browser.py --tb=short
